# ============================================================
#  Integración Continua (CI) — BreadControl
#
#  Once verificaciones por push y pull request. Cada una se comprobó POR SU
#  CAPACIDAD DE FALLAR antes de ponerla a bloquear: un verificador que no puede
#  fallar no verifica nada, solo ocupa el sitio del que sí lo haría.
#
#  Tres de ellas —compilación, unitarias e integración— corren sobre una MATRIZ
#  de PHP 8.2 y 8.3, y ambas bloquean. PHP 8.2 deja de recibir parches el 31 de
#  diciembre de 2026; con 8.3 verde y vigilado, esa migración pasa de ser un
#  riesgo a ser un cambio de versión en el Dockerfile cuando se decida.
#
#    compilación         → sintaxis de todos los archivos PHP (php -l)
#    analisis-estatico   → PHPStan nivel 10 (con phpstan-baseline.neon)
#    pruebas-unitarias   → PHPUnit, suite "Unitarias" (sin base de datos)
#    pruebas-integracion → PHPUnit, suite "Integracion" contra MySQL 8
#    cobertura           → PCOV; falla por debajo del 12 % global
#    mutacion            → Infection; falla por debajo del 69 % de MSI cubierto
#    calidad             → PHPMD contra línea base + informe de PHPMetrics
#    auditoria-seguridad → composer audit, Gitleaks e historial, Semgrep
#    cabeceras           → cabeceras de seguridad sobre la imagen real
#    e2e                 → 16 recorridos de Playwright (solo en PRs hacia main)
#    seguridad           → Snyk; se omite entero si no hay SNYK_TOKEN
#
#  Los umbrales son SUELOS, no metas: impiden que la calidad baje sin que nadie
#  se entere. Subirlos conforme se escriben pruebas es parte del trabajo.
#  El razonamiento de cada uno está en docs/estrategia_pruebas.md.
#
#  HSTS y ocultar la versión del servidor NO se comprueban aquí: viven en el
#  Nginx del VPS y los vigila el flujo cabeceras-produccion.yml, a diario.
# ============================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  compilacion:
    name: Sintaxis PHP (php -l) · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            experimental: false
          # 8.3 BLOQUEA desde el 2026-09-01. Entro en modo informativo ese
          # mismo dia y paso limpio a la primera en las tres ramas, asi que no
          # habia motivo para dejarlo de adorno: a partir de aqui, una regresion
          # que rompa 8.3 no entra.
          #
          # PHP 8.2 deja de recibir parches de seguridad el 31 de diciembre de
          # 2026. Con esto la migracion deja de ser un riesgo y pasa a ser un
          # cambio de version en el Dockerfile cuando se decida.
          #
          # Los otros ocho jobs siguen fijos en 8.2 a proposito: es la version
          # que corre en produccion, y la cobertura, la mutacion o el analisis
          # de seguridad no cambian de respuesta por el interprete.
          - php: '8.3'
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verificar sintaxis de todos los archivos PHP
        run: |
          fallos=0
          while IFS= read -r -d '' archivo; do
            if ! php -l "$archivo" > /dev/null; then
              fallos=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $fallos

  analisis-estatico:
    name: Análisis estático (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Ejecutar PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  pruebas-unitarias:
    name: Pruebas unitarias (PHPUnit) · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            experimental: false
          # 8.3 BLOQUEA desde el 2026-09-01. Entro en modo informativo ese
          # mismo dia y paso limpio a la primera en las tres ramas, asi que no
          # habia motivo para dejarlo de adorno: a partir de aqui, una regresion
          # que rompa 8.3 no entra.
          #
          # PHP 8.2 deja de recibir parches de seguridad el 31 de diciembre de
          # 2026. Con esto la migracion deja de ser un riesgo y pasa a ser un
          # cambio de version en el Dockerfile cuando se decida.
          #
          # Los otros ocho jobs siguen fijos en 8.2 a proposito: es la version
          # que corre en produccion, y la cobertura, la mutacion o el analisis
          # de seguridad no cambian de respuesta por el interprete.
          - php: '8.3'
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Ejecutar suite unitaria
        run: vendor/bin/phpunit --testsuite Unitarias

  pruebas-integracion:
    name: Pruebas de integración (PHPUnit + MySQL) · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            experimental: false
          # 8.3 BLOQUEA desde el 2026-09-01. Entro en modo informativo ese
          # mismo dia y paso limpio a la primera en las tres ramas, asi que no
          # habia motivo para dejarlo de adorno: a partir de aqui, una regresion
          # que rompa 8.3 no entra.
          #
          # PHP 8.2 deja de recibir parches de seguridad el 31 de diciembre de
          # 2026. Con esto la migracion deja de ser un riesgo y pasa a ser un
          # cambio de version en el Dockerfile cuando se decida.
          #
          # Los otros ocho jobs siguen fijos en 8.2 a proposito: es la version
          # que corre en produccion, y la cobertura, la mutacion o el analisis
          # de seguridad no cambian de respuesta por el interprete.
          - php: '8.3'
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: panaderia_bd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: panaderia_bd
      APP_ENV: production
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Importar esquema y semilla de pruebas
        run: |
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/01_esquema_base.sql
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/90_semilla_ci.sql

      - name: Ejecutar suite de integración
        run: vendor/bin/phpunit --testsuite Integracion

  seguridad:
    name: Seguridad (Snyk)
    runs-on: ubuntu-latest
    env:
      # Configurar en: Settings > Secrets and variables > Actions > New repository secret
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Avisar si no hay token
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::SNYK_TOKEN no configurado; se omite el análisis de seguridad."

      - name: Instalar PHP 8.2
        if: env.SNYK_TOKEN != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias
        if: env.SNYK_TOKEN != ''
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Instalar Snyk CLI
        if: env.SNYK_TOKEN != ''
        run: npm install -g snyk

      # Umbral "high": los 9 hallazgos MEDIUM restantes son falsos positivos de
      # XSS del SAST — no reconoce escHtml(), el sanitizador propio de
      # assets/js/utils.js, por el que sí pasa todo valor que llega a innerHTML
      # (verificado leyendo el código, no asumido). No deben bloquear el CI; un
      # fallo HIGH sí lo bloquea.
      #
      # El décimo MEDIUM (Open Redirect en ventas.js) no era un falso positivo y
      # se corrigió comprobando el origen antes de seguir la redirección.
      - name: Vulnerabilidades en dependencias
        if: env.SNYK_TOKEN != ''
        run: snyk test --severity-threshold=high

      - name: Análisis estático de seguridad (SAST)
        if: env.SNYK_TOKEN != ''
        run: snyk code test --severity-threshold=high

  e2e:
    name: Extremo a extremo (Playwright)
    runs-on: ubuntu-latest
    # Solo en PRs hacia main: anade unos minutos y su valor esta en frenar algo
    # ANTES de que entre, no en repetirlo en cada push a una rama de trabajo.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    # Cubre el hueco que ninguna otra herramienta alcanza: controllers/ esta al
    # 0,0 % de cobertura y views/ tiene 12.346 lineas que jamas ejecuta una
    # prueba. Un controlador hace header(), exit y renderiza una plantilla; eso
    # solo se comprueba de verdad con un navegador.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: panaderia_bd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Importar esquema y semillas
        run: |
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/01_esquema_base.sql
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/90_semilla_ci.sql
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/95_semilla_e2e.sql

      # El servidor embebido de PHP y no Apache: las pruebas ejercitan
      # formularios y redirecciones, no reescritura de URL ni cabeceras, y
      # levantarlo es inmediato. Las cabeceras ya las cubre el job "cabeceras"
      # contra la imagen real.
      - name: Levantar la aplicacion
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: panaderia_bd
          APP_ENV: local
          APP_URL: http://127.0.0.1:8099
        run: |
          php -S 127.0.0.1:8099 -t . > servidor.log 2>&1 &
          for intento in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/login.php)" = "200" ]; then
              echo "La aplicacion responde."
              exit 0
            fi
            sleep 1
          done
          echo "::error::La aplicacion no respondio en 30 segundos"
          cat servidor.log
          exit 1

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Ejecutar los recorridos
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8099
        run: npx playwright test

      - name: Publicar el informe si algo fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-informe
          path: |
            e2e/informe
            e2e/test-results
          retention-days: 14

  mutacion:
    name: Pruebas de mutacion (Infection)
    runs-on: ubuntu-latest
    # La cobertura dice que lineas EJECUTA una prueba; no dice si la prueba se
    # enteraria de que esa linea cambio. Infection lo comprueba: altera el codigo
    # (un > por un >=, una condicion invertida, una linea borrada) y mira si
    # alguna prueba falla. Si nadie protesta, ahi hay una prueba que ejecuta
    # codigo sin verificarlo.
    #
    # Primera medicion: 639 mutantes, 421 muertos, 218 escapados. MSI del codigo
    # cubierto 65%. Es decir que de las mutaciones sobre codigo que las pruebas
    # SI ejecutan, un 35% pasa inadvertido.
    #
    # Solo helpers/ y models/ (ver infection.json5): controllers/ esta al 0.0% de
    # cobertura y mutarlo produciria mutantes vivos por definicion.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: panaderia_bd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: panaderia_bd
      APP_ENV: production
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP 8.2 con PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: pcov

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Importar esquema y semilla de pruebas
        run: |
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/01_esquema_base.sql
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/90_semilla_ci.sql

      # --min-covered-msi y no --min-msi: la cobertura global es del 12%, asi que
      # el MSI global mediria sobre todo lo que NO esta probado, que ya lo dice
      # el job de cobertura. Lo que aporta aqui es la calidad de las pruebas que
      # existen, y eso es el MSI del codigo cubierto.
      #
      # 69 es un suelo, no una meta: impide que la calidad de las pruebas baje.
      # Empezo en 65 y sube conforme se refuerzan aserciones; ese es el trabajo,
      # no dejarlo quieto. Ultima subida: 65 -> 69 al reforzar ProduccionModel.
      - name: Ejecutar Infection
        run: |
          vendor/bin/infection \
            --threads=4 \
            --min-covered-msi=69 \
            --no-progress \
            --no-interaction

      - name: Publicar el MSI como anotacion
        if: always()
        run: |
          if [ -f infection/resumen.txt ]; then
            total=$(grep -oP 'Total: \K[0-9]+' infection/resumen.txt || echo 0)
            muertos=$(grep -oP 'Killed by Test Framework: \K[0-9]+' infection/resumen.txt || echo 0)
            escapados=$(grep -oP 'Escaped: \K[0-9]+' infection/resumen.txt || echo 0)
            if [ "$total" -gt 0 ]; then
              msi=$(awk "BEGIN{printf \"%.1f\", ($muertos/$total)*100}")
              echo "::notice title=Mutacion::MSI del codigo cubierto: ${msi}% | ${muertos} muertos, ${escapados} escapados de ${total} mutantes"
            fi
          fi

      - name: Publicar el informe de mutantes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infection-informe
          path: infection/informe.txt
          retention-days: 14

  calidad:
    name: Calidad de codigo (PHPMD + PHPMetrics)
    runs-on: ubuntu-latest
    # Mide complejidad y acoplamiento, que es lo que PHPStan no ve: PHPStan
    # comprueba que los tipos cuadren, no que un metodo de 400 lineas con
    # complejidad ciclomatica 145 sea imposible de mantener.
    #
    # PHPMD va con linea base, igual que PHPStan: los 109 hallazgos actuales
    # quedan registrados y solo falla lo NUEVO. Arreglarlos exige partir los
    # controladores, que es un trabajo de refactor con su propio riesgo; lo que
    # no puede pasar es que la deuda siga creciendo mientras tanto.
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPMD (solo hallazgos nuevos)
        run: |
          vendor/bin/phpmd models,controllers,helpers,includes,config github \
            phpmd.xml --baseline-file phpmd.baseline.xml

      # PHPMetrics no bloquea: no hay un umbral honesto que poner al indice de
      # mantenibilidad de un proyecto que ya existe. Lo que aporta es el mapa
      # —acoplamiento, inestabilidad, distancia a la secuencia principal— para
      # decidir QUE refactorizar primero, y eso se mira, no se automatiza.
      - name: PHPMetrics (informe)
        run: |
          vendor/bin/phpmetrics --report-html=metricas \
            "models,controllers,helpers,includes,config"

      - name: Publicar el informe de metricas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metricas-html
          path: metricas
          retention-days: 14

  auditoria-seguridad:
    name: Auditoria de seguridad (sin token)
    runs-on: ubuntu-latest
    # Tres comprobaciones de seguridad que NO dependen de ningun token.
    #
    # El job "seguridad" (Snyk) se salta entero si SNYK_TOKEN no esta
    # configurado, asi que hasta ahora el CI podia pasar sin haber mirado ni una
    # vez las dependencias, los secretos o el codigo. Estas tres corren siempre.
    #
    # Las tres se midieron contra el repositorio ANTES de ponerlas a bloquear:
    # composer audit limpio, gitleaks limpio sobre los 140 commits del
    # historial, y semgrep con 5 hallazgos ERROR que se revisaron uno a uno y
    # son falsos positivos (ver el paso de semgrep).
    steps:
      # fetch-depth: 0 no es opcional aqui: gitleaks recorre el historial
      # completo, y semgrep necesita el commit base para comparar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # --locked lee composer.lock directamente: no hace falta instalar vendor
      # para saber si alguna version tiene un aviso de seguridad publicado.
      - name: Vulnerabilidades conocidas en dependencias
        run: composer audit --locked

      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # Sobre el historial COMPLETO, no solo sobre el arbol actual: un secreto
      # borrado en un commit posterior sigue estando publicado y sigue siendo
      # valido hasta que se rote. --redact evita que el propio registro del CI
      # se convierta en el sitio donde queda expuesto.
      - name: Secretos en el historial
        run: gitleaks git . --no-banner --redact --exit-code 1

      - name: Instalar Semgrep
        run: pip install --quiet semgrep

      # Sobre los hallazgos NUEVOS, no sobre todos. El repositorio arrastra 5
      # hallazgos ERROR que se revisaron a mano y son falsos positivos:
      #
      #   - 4 x echoed-request sobre `echo json_encode(...)` en endpoints AJAX
      #     (ProduccionController, VentaController x2, PortalPedidoController).
      #     La regla asume salida HTML; aplicar htmlentities ahi CORROMPERIA el
      #     JSON que espera el navegador.
      #   - 1 x echoed-request sobre `<?= (int)($_POST['num_tandas'] ?? 1) ?>`
      #     en views/produccion/nueva_produccion.php. Un entero no transporta XSS.
      #
      # Silenciar la regla entera para que dejaran de salir habria apagado
      # tambien los XSS de verdad. Comparar contra la rama base deja la regla
      # activa y solo bloquea lo que se anada a partir de ahora. Verificado
      # inyectando un `echo $_GET['x']`: lo detecta y sale con codigo 2.
      - name: Analisis estatico de seguridad (nuevos hallazgos)
        if: github.event_name == 'pull_request'
        run: |
          semgrep scan \
            --config p/php --config p/owasp-top-ten \
            --exclude vendor --exclude backups \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --severity ERROR --error --metrics=off

      # En main no hay con que comparar, asi que se informa del total sin
      # bloquear: el corte ya lo hizo la PR antes de llegar aqui.
      - name: Analisis estatico de seguridad (informe completo)
        if: github.event_name != 'pull_request'
        run: |
          semgrep scan \
            --config p/php --config p/owasp-top-ten \
            --exclude vendor --exclude backups \
            --severity ERROR --metrics=off

  cobertura:
    name: Cobertura de pruebas (PCOV)
    runs-on: ubuntu-latest
    # Mide que parte del codigo ejecutan de verdad las 204 pruebas.
    #
    # Hasta ahora el proyecto tenia muchas pruebas y ninguna medida de que
    # cubren, asi que decidir donde escribir la siguiente era ir a ciegas. Corre
    # las DOS suites juntas —unitarias e integracion— porque la cobertura solo
    # significa algo sumada: un modelo puede estar sin tocar por las unitarias y
    # cubierto de sobra por las de integracion.
    #
    # PCOV en vez de Xdebug: hace una sola cosa, medir lineas ejecutadas, y es
    # varias veces mas rapido. No sirve para depurar, que aqui no hace falta.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: panaderia_bd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: panaderia_bd
      APP_ENV: production
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PHP 8.2 con PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: pcov

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Importar esquema y semilla de pruebas
        run: |
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/01_esquema_base.sql
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/90_semilla_ci.sql

      - name: Ejecutar las pruebas con cobertura
        run: |
          vendor/bin/phpunit \
            --coverage-clover cobertura/clover.xml \
            --coverage-html cobertura/html

      # El minimo es 12.0 porque la primera medicion real dio 12.07% (607 de
      # 5030 sentencias). No es una meta, es un suelo: existe para que la
      # cobertura no BAJE sin que nadie se entere, no para dar por buena la
      # cifra. Subirlo a medida que se escriban pruebas es parte del trabajo.
      #
      # Que sea tan bajo tiene una explicacion concreta y no un descuido: las
      # 204 pruebas son de modelos y helpers, y el <source> de phpunit.xml
      # incluye tambien controllers/, que ninguna prueba toca. El desglose por
      # capa que imprime el script lo deja a la vista.
      - name: Desglose por capa y verificacion del minimo
        run: php scripts/verificar_cobertura.php cobertura/clover.xml 12.0

      - name: Publicar el informe navegable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-html
          path: cobertura/html
          retention-days: 14

  cabeceras:
    name: Cabeceras de seguridad (contenedor)
    runs-on: ubuntu-latest
    # Levanta la imagen real de la aplicación y comprueba que sigue emitiendo
    # las cabeceras del informe técnico del 2026-08-12 (R-01, R-03, R-04, R-05).
    #
    # Hasta ahora esas correcciones vivían solo en .htaccess y en el Dockerfile,
    # sin nada que impidiera revertirlas por descuido: se editan por motivos de
    # caché o rendimiento, no de seguridad, y una llave de más las desactiva sin
    # que falle nada visible. Aquí sí falla.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: panaderia_bd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Importar esquema y semilla de pruebas
        run: |
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/01_esquema_base.sql
          mysql -h 127.0.0.1 -uroot -proot panaderia_bd < sql/init/90_semilla_ci.sql

      - name: Construir la imagen de la aplicación
        run: docker build -t breadcontrol:ci .

      # --network host para que el contenedor alcance el MySQL de servicio en
      # 127.0.0.1:3306, que es donde Actions lo publica. APP_ENV=production es
      # deliberado: es lo que hace que la cookie salga con Secure aunque aquí se
      # sirva por HTTP plano, y comprobarlo en esas condiciones es justo lo que
      # blinda la corrección de R-01.
      - name: Levantar el contenedor
        run: |
          docker run -d --name breadcontrol --network host \
            -e APP_ENV=production \
            -e APP_URL=http://127.0.0.1 \
            -e DB_HOST=127.0.0.1 \
            -e DB_USER=root \
            -e DB_PASS=root \
            -e DB_NAME=panaderia_bd \
            breadcontrol:ci

      - name: Esperar a que la aplicación responda
        run: |
          for intento in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = "200" ]; then
              echo "La aplicación responde."
              exit 0
            fi
            sleep 2
          done
          echo "::error::La aplicación no respondió con 200 en 60 segundos"
          docker logs breadcontrol
          exit 1

      - name: Verificar cabeceras de seguridad
        run: bash scripts/verificar_cabeceras.sh http://127.0.0.1/ --perfil contenedor

      - name: Registro del contenedor si algo falló
        if: failure()
        run: docker logs breadcontrol
