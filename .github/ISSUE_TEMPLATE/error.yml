name: Reportar un error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **¿Es un fallo de seguridad?** No lo publiques aquí. Usa
        [Report a vulnerability](https://github.com/Manuel151025/breadcontrol/security/advisories/new),
        que es privado.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo que ves, con el mensaje de error tal cual si lo hay.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Desde dónde empiezas y qué haces, en orden.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: dropdown
    id: rol
    attributes:
      label: Con qué cuenta ocurre
      options:
        - Propietario (back-office)
        - Empleado (back-office)
        - Cliente del portal
        - Aprendiz
        - Instructor
        - Sin iniciar sesión
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: La etiqueta (por ejemplo v1.11.0) o el commit sobre el que lo viste.
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      value: |
        - PHP:
        - MySQL o MariaDB:
        - Navegador:
        - Local, Docker o sitio publicado:
  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Antes de enviar
      options:
        - label: No es un fallo de seguridad
          required: true
        - label: Busqué si ya estaba reportado y miré LIMITACIONES_Y_TRABAJO_FUTURO.md
          required: true
